name: Hook Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  hook-harness:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run hook harness
        run: python -m unittest -v tests.hook_harness
